<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#181335" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#007CF0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M 0,120 L 1280,120 M 0,240 L 1280,240 M 0,360 L 1280,360 M 0,480 L 1280,480 M 0,600 L 1280,600" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
  </g>

  <!-- Glowing Waveform / Bode Plot Graphic -->
  <path d="M 100,500 C 300,500 400,200 600,360 C 800,520 900,180 1180,220" fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)" />
  <path d="M 100,420 C 250,150 450,550 700,250 C 850,100 1000,450 1180,380" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.8" />

  <!-- Feedback Loop Node Diagram -->
  <g transform="translate(820, 420)">
    <rect x="0" y="0" width="140" height="70" rx="12" fill="rgba(121, 40, 202, 0.2)" stroke="#7928CA" stroke-width="2" />
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">G(s)</text>
    <rect x="180" y="0" width="140" height="70" rx="12" fill="rgba(0, 223, 216, 0.2)" stroke="#00DFD8" stroke-width="2" />
    <text x="250" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">K(s)</text>
    <circle x="-60" y="35" r="24" fill="rgba(255,255,255,0.05)" stroke="#ffffff" stroke-width="2" />
    <text x="-60" y="42" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- Title & Subtitle Text -->
  <g transform="translate(100, 260)">
    <rect x="0" y="-45" width="260" height="36" rx="18" fill="rgba(121, 40, 202, 0.3)" stroke="#7928CA" stroke-width="1" />
    <text x="130" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">PYTHON CONTROL SYSTEMS</text>

    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">python-control</text>
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" fill="#A0AEC0">State-Space, DLQE, Frequency Domain Analysis &amp; Control Design</text>
  </g>

  <!-- Tech Badges Graphic Pill -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="150" height="38" rx="8" fill="#1A202C" stroke="#2D3748" />
    <text x="75" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">SciPy &amp; NumPy</text>

    <rect x="165" y="0" width="140" height="38" rx="8" fill="#1A202C" stroke="#2D3748" />
    <text x="235" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#A78BFA" text-anchor="middle">Slycot FORTRAN</text>

    <rect x="320" y="0" width="150" height="38" rx="8" fill="#1A202C" stroke="#2D3748" />
    <text x="395" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F472B6" text-anchor="middle">BSD 3-Clause</text>
  </g>
</svg>